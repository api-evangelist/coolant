aid: coolant
name: Coolant
description: >-
  Coolant (Coolant Climate, Inc.) is a climate-technology startup building
  AI-powered forest monitoring and carbon measurement from consumer-grade drone
  imagery. Its "3D spatial intelligence" platform reconstructs high-resolution
  3D forest models from ordinary drone footage (DJI Mini, Mavic) and applies
  computer vision to measure biomass, tree height, diameter at breast height
  (DBH), tree counts, species, and growth rates — delivering LiDAR-grade
  accuracy at a fraction of the cost. The company positions this as the
  measurement, reporting, and verification (MRV) layer for scalable, verifiable
  carbon removal, reforestation success tracking, and conservation planning.
  Coolant raised a $4.3M seed round from General Catalyst and Floodgate in
  October 2025. As of this profile the company operates a marketing site, a
  demo web application, and a technical blog, but publishes no public developer
  API, SDK, or documentation surface.
